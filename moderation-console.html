<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EchoDrop Moderation</title>
<!--
  Standalone moderation console. Open this file in a browser (double-click, or
  bookmark file:///path/to/moderation-console.html). Nothing secret lives here —
  it's password-gated by the moderation-console edge function, which holds the
  service-role key server-side. Supabase forces text/plain on its own hosting,
  so this page is deliberately a local/static file rather than a hosted URL.
-->
<style>
  :root { color-scheme: light dark; --bg:#f7f7f8; --card:#fff; --line:#e5e7eb; --text:#111827; --muted:#6b7280; --pri:#4f46e5; --danger:#dc2626; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0b0d12; --card:#151922; --line:#262b36; --text:#e5e7eb; --muted:#9aa4b2; --pri:#818cf8; } }
  *{box-sizing:border-box} body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
  header h1{font-size:16px;margin:0;font-weight:700} header .sp{flex:1}
  button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:9px;cursor:pointer}
  button:hover{border-color:var(--pri)} button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
  button.danger{color:var(--danger);border-color:var(--danger)} button.sm{padding:4px 9px;font-size:13px;border-radius:7px}
  main{max-width:1000px;margin:0 auto;padding:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 18px;overflow:hidden}
  .card h2{font-size:14px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .badge{font-size:12px;background:var(--line);color:var(--muted);border-radius:999px;padding:1px 8px}
  .row{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .row:last-child{border-bottom:0} .row .grow{flex:1;min-width:200px}
  .name{font-weight:600} .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-right:4px}
  .tag.minor{color:var(--danger);border-color:var(--danger)}
  .empty{padding:16px;color:var(--muted)}
  .login{max-width:380px;margin:12vh auto;padding:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .login h1{font-size:18px;margin:0 0 4px} .login p{color:var(--muted);margin:0 0 16px;font-size:14px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);margin-bottom:12px}
  .err{color:var(--danger);font-size:13px;min-height:18px;margin-bottom:8px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .hint{font-size:12px;color:var(--muted);padding:0 16px 12px}
</style></head><body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
// The JSON API (holds the service-role key; gates on your password).
const API="https://bhjncxwifgywgvnyoirv.supabase.co/functions/v1/moderation-console";
const $=(s,r=document)=>r.querySelector(s);
let PW="";
function esc(s){const d=document.createElement("div");d.textContent=(s==null?"":String(s));return d.innerHTML;}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}
async function api(action,args={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:PW,action,...args})});
  const j=await r.json().catch(()=>({error:"Bad response"}));
  if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
function loginView(msg){
  $("#app").innerHTML=`<div class="login"><h1>EchoDrop Moderation</h1><p>Enter the console password.</p>
    <div class="err">${esc(msg||"")}</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" />
    <button class="pri" style="width:100%" id="go">Unlock</button></div>`;
  const submit=async()=>{PW=$("#pw").value;try{await api("login");load();}catch(e){PW="";loginView(e.message);} };
  $("#go").onclick=submit; $("#pw").onkeydown=e=>{if(e.key==="Enter")submit()}; $("#pw").focus();
}
function reasonPrompt(def){return (prompt("Reason (shown in the user's notice, keep it short):",def)||def).slice(0,80);}
async function act(fn,okMsg){try{await fn();toast(okMsg);await load(false);}catch(e){toast("⚠ "+e.message);}}
function shell(data){
  const rq=data.reportQueue,rv=data.reviewQueue,en=data.enforcement;
  const repRows=rq.length?rq.map(a=>`<div class="row"><div class="grow">
      <div class="name">${esc(a.username||a.reported_user_id)} <span class="tag">${esc(a.account_status)}</span>${a.involves_minor?'<span class="tag minor">involves minor</span>':''}</div>
      <div class="meta">${a.open_reports} report(s) · strikes ${a.strikes} · ${esc((a.reasons||[]).join(", "))}</div></div>
      <button class="sm" data-act="suspend" data-id="${esc(a.reported_user_id)}">Suspend</button>
      <button class="sm danger" data-act="ban" data-id="${esc(a.reported_user_id)}">Ban</button>
      <button class="sm" data-act="dismiss" data-id="${esc(a.reported_user_id)}">Dismiss</button></div>`).join(""):'<div class="empty">No open reports 🎉</div>';
  const revRows=rv.length?rv.map(x=>{
      const isCsam=x.source==="csam_report";
      const label=isCsam?"CSAM report":(x.detail&&x.detail.report_type?esc(x.detail.report_type):"review item");
      const btns=isCsam
        ? `<button class="sm danger" data-act="csam1" data-id="${esc(x.ref_id)}">Confirm CSAM</button><button class="sm" data-act="csam0" data-id="${esc(x.ref_id)}">Dismiss</button>`
        : `<button class="sm" data-act="suspend" data-id="${esc(x.subject_user_id)}">Suspend</button><button class="sm danger" data-act="ban" data-id="${esc(x.subject_user_id)}">Ban</button>`;
      return `<div class="row"><div class="grow"><div class="name">${label}</div>
        <div class="meta">subject ${esc(x.subject_user_id)} · ${esc(x.created_at)}</div></div>${btns}</div>`;
    }).join(""):'<div class="empty">Nothing awaiting review.</div>';
  const enRows=en.length?en.map(u=>`<div class="row"><div class="grow">
      <div class="name">${esc(u.username||u.user_id)} <span class="tag">${esc(u.account_status)}</span></div>
      <div class="meta">${esc(u.restriction_reason||"")}${u.suspended_until?" · until "+esc(u.suspended_until):" · permanent"}</div></div>
      <button class="sm" data-act="lift" data-id="${esc(u.user_id)}">Lift</button></div>`).join(""):'<div class="empty">No suspended or banned accounts.</div>';
  $("#app").innerHTML=`
   <header><h1>EchoDrop Moderation</h1><div class="sp"></div>
     <button class="sm" id="refresh">Refresh</button><button class="sm" id="logout">Lock</button></header>
   <main>
     <div class="card"><h2>Reported accounts <span class="badge">${rq.length}</span></h2>${repRows}
       <div class="hint">Reports auto-escalate at 3 distinct reporters; provisional suspend at 5. Dismiss clears an account's open reports.</div></div>
     <div class="card"><h2>Child-safety review <span class="badge">${rv.length}</span></h2>${revRows}
       <div class="hint">Confirm runs the ban + evidence-preservation chain. When unsure, review per the CSAM runbook first.</div></div>
     <div class="card"><h2>Currently enforced <span class="badge">${en.length}</span></h2>${enRows}</div>
   </main>`;
  $("#refresh").onclick=()=>load();
  $("#logout").onclick=()=>{PW="";loginView();};
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>handle(b.dataset.act,b.dataset.id));
}
function handle(act_,id){
  if(act_==="suspend"){const d=parseInt(prompt("Suspend for how many days?","7")||"0",10);if(!d)return;const r=reasonPrompt("repeated_guideline_violations");act(()=>api("suspend",{userId:id,days:d,reason:r}),"Suspended");}
  else if(act_==="ban"){if(!confirm("Ban this account permanently? They will be signed out and blocked."))return;const r=reasonPrompt("severe_guideline_violation");act(()=>api("ban",{userId:id,reason:r}),"Banned");}
  else if(act_==="lift"){if(!confirm("Lift enforcement and reinstate this account?"))return;act(()=>api("lift",{userId:id}),"Lifted");}
  else if(act_==="dismiss"){if(!confirm("Dismiss all open reports for this account?"))return;act(()=>api("dismiss_reports",{userId:id}),"Dismissed");}
  else if(act_==="csam1"){if(!confirm("CONFIRM as CSAM? This permanently bans the uploader, preserves evidence, and records the report. Only after review."))return;act(()=>api("confirm_csam",{reportId:id}),"Confirmed");}
  else if(act_==="csam0"){if(!confirm("Dismiss this report as not CSAM? The preserved copy is deleted."))return;act(()=>api("dismiss_csam",{reportId:id}),"Dismissed");}
}
async function load(spin=true){try{if(spin)$("#app").innerHTML='<main><p style="color:var(--muted)">Loading…</p></main>';const d=await api("queues");shell(d);}catch(e){PW="";loginView(e.message);}}
loginView();
</script></body></html>
